# CloudCannon configuration for Heart to Heart
# Plain HTML site — no build step.
# Docs: https://cloudcannon.com/documentation/
# The "Create Site" wizard may tweak this file; that's fine.

# Where images added through the editor get saved (inside the repo).
paths:
  uploads: assets/uploads

collections_config:
  pages:
    path: ""
    glob:
      - "*.html"
      - "!assets/**"
    name: Pages
    icon: article
    # Stop editors creating brand-new (and probably broken) pages by hand.
    disable_add: true
    disable_add_folder: true
    _enabled_editors:
      - visual

# Toolbar shown when an editor clicks an editable region on the page.
_editables:
  content:
    bold: true
    italic: true
    link: true
    bulletedlist: true
    numberedlist: true
    undo: true
    redo: true
    removeformat: true
